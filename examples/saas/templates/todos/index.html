{% extends "base.html" %}
{% block title %}Todos · saas{% endblock %}
{% block content %}
<header class="bar">
  <h1>Todos</h1>
  <form hx-post="/logout"><small>{{ email }}</small> <button class="link">Log out</button></form>
</header>

<form hx-post="/todos" hx-target="#todos" hx-on::after-request="if (event.detail.successful) this.reset()">
  <input name="title" placeholder="What needs doing?" required maxlength="200" autofocus>
  <button>Add</button>
</form>

<ul id="todos">
  {% block list %}
  {% for todo in todos %}
  <li class="{{ 'done' if todo.done }}">
    <label>
      <input type="checkbox" {{ 'checked' if todo.done }}
             hx-post="/todos/{{ todo.id }}/toggle" hx-target="#todos">
      {{ todo.title }}
    </label>
    <button class="link" hx-delete="/todos/{{ todo.id }}" hx-target="#todos" aria-label="Delete">✕</button>
  </li>
  {% else %}
  <li class="empty">Nothing to do yet.</li>
  {% endfor %}
  {% endblock %}
</ul>

<p><small>JSON API and interactive docs at <a href="/docs">/docs</a>.</small></p>
{% endblock %}
