[package]
name = "diesel-shop"
description = "A shop API on zapline + Diesel: a blocking ORM on a thread pool, embedded migrations, immediate transactions, DI and health checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# No `sqlite` feature: Diesel brings its own connections (r2d2 pool).
zapline.workspace = true
serde.workspace = true
tokio = { version = "1", features = ["rt"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
# Compile SQLite in, so nothing needs to be installed on the machine.
libsqlite3-sys = { version = ">=0.30, <0.36", features = ["bundled"] }

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
tempfile = "3"
