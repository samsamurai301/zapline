[package]
name = "sqlx-transactions"
description = "A double-entry ledger on zapline + sqlx: transactions, savepoints, idempotency keys, DI and health checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
zapline = { workspace = true, features = ["sqlite"] }
sqlx = { version = "0.8.6", default-features = false, features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
tempfile = "3"
