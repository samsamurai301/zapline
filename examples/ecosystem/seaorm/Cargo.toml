[package]
name = "seaorm-blog"
description = "A blog API on zapline + SeaORM: entities, relations, migrations, pagination, transactions, DI and health checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# No `sqlite` feature: SeaORM brings its own connection pool.
zapline.workspace = true
serde.workspace = true
# SeaORM 1.1 (MSRV 1.81); 2.x needs Rust 1.94.
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio", "macros"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio"] }

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
