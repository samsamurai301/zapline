[package]
name = "zapline-examples"
version = "0.0.0"
edition = "2021"
publish = false

# Examples live in examples/examples/*.rs and are auto-discovered:
#   cargo run -p zapline-examples --example hello

[dependencies]
zapline = { path = "../crates/zapline", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
validator = { version = "0.21", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
