[package]
name = "zapline-macros"
description = "Route attribute macros (#[get], #[post], ...) for the zapline web framework"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/zapline-macros"
keywords = ["web", "http", "framework", "macros", "zapline"]
categories = ["web-programming::http-server"]

[lib]
proc-macro = true

# Set by zapline's features of the same name: what `#[model]` derives.
[features]
openapi = []
validate = []

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
