[package]
name = "zapline-cli"
description = "Command-line tooling for the zapline web framework"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["web", "framework", "cli", "scaffolding", "zapline"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "zapline_cli"
path = "src/lib.rs"

# `zapline <cmd>`
[[bin]]
name = "zapline"
path = "src/main.rs"

# `cargo zapline <cmd>` (cargo passes the subcommand name as the first argument).
[[bin]]
name = "cargo-zapline"
path = "src/bin/cargo-zapline.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
notify = "8"   # default features: FSEvents on macOS
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }
signal-hook = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"
# tests/mcp_live.rs runs a real app for the live MCP tools (path-only: not published).
zapline = { path = "../zapline" }
tokio = { version = "1", features = ["rt", "net", "macros"] }
