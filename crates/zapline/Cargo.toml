[package]
name = "zapline"
description = "A fast, low-boilerplate Rust web framework"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["macros", "json", "query", "form"]
macros = ["dep:zapline-macros"]
json = ["dep:serde_json"]
query = ["dep:serde_urlencoded"]
form = ["dep:serde_urlencoded"]

[dependencies]
zapline-macros = { path = "../zapline-macros", version = "0.1.0", optional = true }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "macros", "signal", "sync"] }
socket2 = { version = "0.6", features = ["all"] }
matchit = "0.8"
serde = "1"
serde_json = { version = "1", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
percent-encoding = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
