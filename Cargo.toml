[workspace]
resolver = "2"
members = ["crates/zapline", "crates/zapline-macros", "examples", "bench/servers"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/zapline"
rust-version = "1.80"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
