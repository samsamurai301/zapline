name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy -p zapline -p zapline-macros --all-targets -- -D warnings
      - run: cargo test -p zapline
      - run: cargo check -p zapline --no-default-features
      - run: cargo build -p zapline-examples --examples

  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y wrk bc
      # Shared CI runners are noisy: treat these numbers as a smoke test,
      # not as published results.
      - run: DURATION=5s ROUNDS=1 ./bench/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results.md
