name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting is platform-independent: check it once.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Lints and the full test suite on every desktop/server OS.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The generated-client tests type-check with tsc and run the client in
      # node; they skip themselves where either is missing.
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 22
      - name: install tsc
        if: matrix.os == 'ubuntu-latest'
        run: npm install -g typescript@5.9.2
      - name: clippy
        run: cargo clippy --workspace --exclude bench-servers --all-features --all-targets -- -D warnings
      - name: test zapline
        run: cargo test -p zapline --all-features
      - name: test zapline-macros
        run: cargo test -p zapline-macros
      - name: test zapline-codegen
        run: cargo test -p zapline-codegen
      - name: test zapline-cli
        run: cargo test -p zapline-cli
      - name: build examples
        run: cargo build -p zapline-examples --examples

  # Every Cargo feature must compile on its own.
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p zapline --no-default-features
      - name: each feature alone
        shell: bash
        run: |
          for f in macros json query form openapi validate config tracing http2 tls http3 ws fs multipart compression jwt jwks cookies views postgres sqlite password mail storage s3 cache oauth i18n redis redis-tls otlp tz; do
            echo "::group::$f"
            cargo check -p zapline --no-default-features --features "$f"
            echo "::endgroup::"
          done

  # zapline::db against a real Postgres (SQLite runs in the main test job).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p zapline --features postgres,sqlite --test db --test db_postgres
        env:
          ZAPLINE_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres

  # examples/ecosystem: zapline with sqlx, SeaORM, Diesel and Leptos. Its own
  # workspace, so these dependencies never reach the jobs above.
  ecosystem:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ecosystem
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/ecosystem
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The documented minimum supported Rust version.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p zapline -p zapline-macros -p zapline-codegen -p zapline-cli --all-features

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p zapline --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: llms.txt is current
        run: ./scripts/gen-llms.sh --check
      - name: build the guide
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          ./mdbook build docs

  # Projects generated by `zapline new` must build and pass their own tests
  # against this checkout, on every OS.
  scaffold:
    name: scaffold (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: generate and test every template
        shell: bash
        run: |
          cargo build -p zapline-cli
          # Git Bash on Windows uses /d/a/... paths that native tools (cargo,
          # the CLI) can't resolve: convert to D:/a/... there.
          native() { if command -v cygpath >/dev/null; then cygpath -m "$1"; else echo "$1"; fi; }
          ROOT="$(native "$PWD")"
          WORK="$(native "$RUNNER_TEMP")/scaffold"
          mkdir -p "$WORK"
          for t in minimal api full fullstack; do
            echo "::group::template $t"
            "$ROOT/target/debug/zapline" new "demo-$t" --template "$t" --path "$WORK" --zapline-path "$ROOT/crates/zapline" --no-git
            if [ "$t" = fullstack ]; then
              # The database-backed generator must produce code that builds and passes its tests.
              (cd "$WORK/demo-$t" && "$ROOT/target/debug/zapline" g resource product name price:float stock:int 'notes:text?' featured:bool \
                && "$ROOT/target/debug/zapline" g auth && "$ROOT/target/debug/zapline" g job send_welcome)
            fi
            (cd "$WORK/demo-$t" && CARGO_TARGET_DIR="$ROOT/target/scaffold" cargo test)
            if [ "$t" != minimal ] && [ "$RUNNER_OS" = Linux ]; then
              # The generated TypeScript client must type-check under the strictest settings.
              (cd "$WORK/demo-$t" && CARGO_TARGET_DIR="$ROOT/target/scaffold" "$ROOT/target/debug/zapline" client -o web/api.ts \
                && npx --yes -p typescript@5.9.3 tsc --noEmit --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess \
                     --noUnusedLocals --target es2022 --lib es2022,dom --module esnext --moduleResolution bundler web/api.ts)
            fi
            echo "::endgroup::"
          done

  # The token benchmark is deterministic: check its numbers are reproducible.
  token-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bench/tokens
      - run: (cd bench/tokens && cargo test -q && ./run.sh)
      - uses: actions/upload-artifact@v5
        with:
          name: token-bench-results
          path: bench/tokens/results.md

  # Smoke-run the benchmark harness (shared runners are noisy: not results).
  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y wrk bc
      - run: DURATION=3s ROUNDS=1 ./bench/run.sh
      - uses: actions/upload-artifact@v5
        with:
          name: bench-results
          path: bench/results.md
