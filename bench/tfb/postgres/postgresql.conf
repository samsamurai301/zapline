# Tuned like TechEmpower's benchmark database: plenty of connections, data
# held in memory, and no waiting on fsync (every framework gets the same).
listen_addresses = '*'
port = 55432 # off the default, so a local Postgres on 5432 does not clash
max_connections = 2000
shared_buffers = 256MB
work_mem = 16MB
synchronous_commit = off
fsync = on
checkpoint_timeout = 30min
max_wal_size = 4GB
log_min_messages = warning
