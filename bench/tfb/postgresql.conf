# TFB's Postgres settings (toolset/databases/postgres/postgresql.conf), for
# the local cluster run.sh starts. Dropped: io_workers (Postgres 18 only;
# TFB runs postgres:18) and listen_addresses (the local cluster only
# listens on 127.0.0.1).
max_connections = 2000
ssl = false
shared_buffers = 256MB
work_mem = 64MB
maintenance_work_mem = 512MB
wal_level = minimal
synchronous_commit = off
checkpoint_completion_target = 0.9
max_wal_senders = 0
random_page_cost = 2
effective_cache_size = 8GB
log_line_prefix = '%t '
track_activity_query_size = 2048
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 500000
max_pred_locks_per_transaction = 256
