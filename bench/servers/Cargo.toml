[package]
name = "bench-servers"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
zapline = { path = "../../crates/zapline" }
axum = "0.8"
actix-web = { version = "4", default-features = false, features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
