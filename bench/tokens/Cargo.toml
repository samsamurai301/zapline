[package]
name = "token-bench"
version = "0.0.0"
edition = "2021"
publish = false

# The same notes API written three ways; see README.md. Not part of the
# workspace, so the comparison frameworks stay out of zapline's lockfile.
[workspace]

[[bin]]
name = "zapline"
path = "src/bin/zapline.rs"

[[bin]]
name = "axum"
path = "src/bin/axum.rs"

[[bin]]
name = "actix"
path = "src/bin/actix.rs"

[dependencies]
zapline = { path = "../../crates/zapline" }
axum = "0.8"
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
validator = { version = "0.21", features = ["derive"] }
utoipa = { version = "5", features = ["actix_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum", "actix-web"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
