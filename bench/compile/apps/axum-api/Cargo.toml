[package]
name = "axum-api"
version = "0.1.0"
edition = "2021"
publish = false

# The axum equivalent of `zapline new --template api`: the same /health and
# /users CRUD routes with validation, an OpenAPI document with a docs UI,
# and security headers. See ../../README.md.
[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.21", features = ["derive"] }
utoipa = "5"
utoipa-scalar = { version = "0.3", features = ["axum"] }
tower-http = { version = "0.6", features = ["set-header"] }
