[package]
name = "actix-api"
version = "0.1.0"
edition = "2021"
publish = false

# The actix-web equivalent of `zapline new --template api`: the same
# /health and /users CRUD routes with validation, an OpenAPI document with a
# docs UI, and security headers. See ../../README.md.
[workspace]

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.21", features = ["derive"] }
utoipa = { version = "5", features = ["actix_extras"] }
utoipa-scalar = { version = "0.3", features = ["actix-web"] }
